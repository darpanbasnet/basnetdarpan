<!DOCTYPE html>
<html lang="{{ .Language.Lang | default "en-us" }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}{{ end }}">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">

    <script>
        (() => {
            try {
                const storedTheme = localStorage.getItem('theme');
                if (storedTheme === 'light' || storedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', storedTheme);
                }
            } catch (error) {
                // Ignore storage failures and keep the default theme.
            }
        })();
    </script>

    {{ $fonts := resources.Get "css/fonts.css" | resources.Minify | resources.Fingerprint }}
    <link rel="stylesheet" href="{{ $fonts.RelPermalink }}">

    {{ $style := resources.Get "css/style.css" | resources.Minify | resources.Fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
</head>
<body data-home-url="{{ "/" | relLangURL }}">
    <div class="site-container">
        {{ partial "header.html" . }}
        
        <main class="main-content">
            {{ block "main" . }}{{ end }}
        </main>
        
        {{ partial "footer.html" . }}
    </div>
    <button id="scroll-cue" class="scroll-cue" type="button" aria-label="Scroll to next section" hidden>
        <svg class="scroll-cue__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 6v12M6.5 12.5l5.5 5.5 5.5-5.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </button>
    <script>
        (() => {
            const backButton = document.getElementById('back-button');
            const themeToggle = document.getElementById('theme-toggle');
            const toggle = document.getElementById('nav-toggle');
            const nav = document.getElementById('site-nav');
            const backdrop = document.getElementById('nav-backdrop');
            const scrollCue = document.getElementById('scroll-cue');
            const scroller = document.querySelector('.main-content');
            const root = document.documentElement;
            const mobileQuery = window.matchMedia('(max-width: 768px)');
            const syncMobileFrame = () => {
                document.body.classList.toggle('is-mobile-frame', mobileQuery.matches);
            };
            const getScrollTargets = () => {
                if (!scroller) {
                    return [];
                }

                return Array.from(scroller.querySelectorAll('h2, h3'))
                    .filter((element) => element.getBoundingClientRect().height > 0);
            };
            const getElementTop = (element) => {
                if (!scroller) {
                    return 0;
                }

                const scrollerRect = scroller.getBoundingClientRect();
                const elementRect = element.getBoundingClientRect();
                return elementRect.top - scrollerRect.top + scroller.scrollTop;
            };
            const getNextTarget = () => {
                if (!scroller) {
                    return null;
                }

                const currentTop = scroller.scrollTop + 24;
                const targets = getScrollTargets();

                return targets.find((element) => getElementTop(element) > currentTop) || null;
            };
            const syncScrollCue = () => {
                if (!scrollCue || !scroller) {
                    return;
                }

                const hasOverflow = scroller.scrollHeight > scroller.clientHeight + 8;
                const nearBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 24;
                const nextTarget = getNextTarget();
                const shouldShow = hasOverflow && !nearBottom && nextTarget;

                scrollCue.hidden = !shouldShow;
                scrollCue.classList.toggle('is-visible', Boolean(shouldShow));
            };
            const scrollToNextTarget = () => {
                if (!scroller) {
                    return;
                }

                const nextTarget = getNextTarget();
                if (!nextTarget) {
                    return;
                }

                scroller.scrollTo({
                    top: getElementTop(nextTarget) - 20,
                    behavior: 'smooth',
                });
            };

            const applyTheme = (theme) => {
                const nextTheme = theme === 'light' ? 'light' : 'dark';
                root.setAttribute('data-theme', nextTheme);

                if (themeToggle) {
                    themeToggle.setAttribute('aria-label', nextTheme === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
                    themeToggle.classList.toggle('is-light', nextTheme === 'light');
                }

                try {
                    localStorage.setItem('theme', nextTheme);
                } catch (error) {
                    // Ignore storage failures.
                }
            };

            let storedTheme = 'dark';
            try {
                storedTheme = localStorage.getItem('theme') || 'dark';
            } catch (error) {
                storedTheme = 'dark';
            }
            applyTheme(storedTheme);
            syncMobileFrame();

            if (!toggle || !nav || !backdrop) {
                if (backButton) {
                    backButton.addEventListener('click', () => {
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = document.body.dataset.homeUrl || '/';
                        }
                    });
                }
                return;
            }

            const syncState = (isOpen) => {
                const mobile = mobileQuery.matches;
                const shouldShowDrawer = mobile && isOpen;

                toggle.setAttribute('aria-expanded', String(isOpen));
                toggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
                toggle.classList.toggle('is-active', isOpen);
                nav.classList.toggle('is-open', shouldShowDrawer);
                nav.setAttribute('aria-hidden', String(mobile ? !isOpen : false));
                backdrop.hidden = !shouldShowDrawer;
                backdrop.classList.toggle('is-visible', shouldShowDrawer);
                root.classList.toggle('is-menu-open', shouldShowDrawer);
                document.body.classList.toggle('is-nav-open', shouldShowDrawer);
            };

            syncState(false);

            toggle.addEventListener('click', () => {
                const isOpen = toggle.getAttribute('aria-expanded') === 'true';
                syncState(!isOpen);
            });

            backdrop.addEventListener('click', () => syncState(false));

            nav.querySelectorAll('a').forEach((link) => {
                link.addEventListener('click', () => syncState(false));
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    syncState(false);
                }
            });

            mobileQuery.addEventListener('change', () => {
                syncMobileFrame();
                syncState(false);
            });

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const nextTheme = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    applyTheme(nextTheme);
                });
            }

            if (backButton) {
                backButton.addEventListener('click', () => {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = document.body.dataset.homeUrl || '/';
                    }
                });
            }

            if (scrollCue && scroller) {
                scrollCue.addEventListener('click', scrollToNextTarget);
                scroller.addEventListener('scroll', syncScrollCue, { passive: true });
                window.addEventListener('resize', syncScrollCue);
                window.addEventListener('load', syncScrollCue);
                syncScrollCue();
            }
        })();
    </script>
</body>
</html>
