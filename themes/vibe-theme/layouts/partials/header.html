<header class="site-header">
    <div class="header-inner">
        {{ $site := .Site }}
        {{ $current := . }}
        <button
            id="back-button"
            class="back-button"
            type="button"
            aria-label="Go back"
        >
            <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
        >
            <svg class="theme-icon theme-icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
            <svg class="theme-icon theme-icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
            </svg>
        </button>
        {{ with $site.Menus.main }}
        <button
            id="nav-toggle"
            class="nav-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-controls="site-nav"
            aria-expanded="false"
        >
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <svg class="nav-icon nav-icon--close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
        <div id="nav-backdrop" class="nav-backdrop" hidden></div>
        <nav id="site-nav" class="site-nav" aria-label="Main navigation" aria-hidden="true">
            <ul class="menu">
                {{ range . }}
                {{ $active := or (eq $current.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $current.RelPermalink .URL)) }}
                <li class="menu-item">
                    <a href="{{ .URL }}" class="{{ if $active }}active{{ end }}">{{ .Name }}</a>
                </li>
                {{ end }}
            </ul>
        </nav>
        {{ end }}
    </div>
</header>
