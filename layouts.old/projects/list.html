{{ define "main" }}
<div class="container site-main">
  <h1>{{ .Title }}</h1>
  {{ if .Content }}
  <div class="page-content">{{ .Content }}</div>
  {{ end }}

  <div class="post-list">
    {{ range .RegularPages.ByDate.Reverse }}
      {{ partial "post/list-item-default.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}
